name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Pinned workflow validator. Bump deliberately after verifying the release.
  ACTIONLINT_VERSION: "1.7.7"

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Rustdoc (warning-failing)
        # Fail on broken intra-doc links and any other rustdoc warning so
        # source API documentation cannot silently drift. Runs offline against
        # the supported host/contract feature configuration.
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --all-features

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --package will

      - name: Check WASM size
        run: |
          WASM_FILE=$(find target/wasm32-unknown-unknown/release -name '*.wasm' | head -n 1)
          if [ -z "$WASM_FILE" ]; then
            echo "No WASM file produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM_FILE")
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 65536 ]; then
            echo "WASM exceeds 64KB limit"
            exit 1
          fi

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned actionlint
        # Download the pinned release binary directly so the check is
        # reproducible and does not depend on a floating action tag.
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ACTIONLINT_ARCH=amd64 ;;
            aarch64|arm64) ACTIONLINT_ARCH=arm64 ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${ACTIONLINT_ARCH}.tar.gz"
          curl -fsSL "$URL" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate workflows
        # Same entrypoint used locally: enumerates .github/workflows/*.yml
        # deterministically and fails on invalid expression contexts, unknown
        # workflow keys and bad action inputs. Runs offline (no GitHub API).
        run: .github/scripts/check-workflows.sh
