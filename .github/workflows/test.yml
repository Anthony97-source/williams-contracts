name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Rustdoc (warning-failing)
        # Fail on broken intra-doc links and any other rustdoc warning so
        # source API documentation cannot silently drift. Runs offline against
        # the supported host/contract feature configuration.
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --all-features

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --package will

      - name: Check WASM size
        run: |
          WASM_FILE=$(find target/wasm32-unknown-unknown/release -name '*.wasm' | head -n 1)
          if [ -z "$WASM_FILE" ]; then
            echo "No WASM file produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM_FILE")
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 65536 ]; then
            echo "WASM exceeds 64KB limit"
            exit 1
          fi
